name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = "7c3d51a3-ca06-4f78-bfe6-d2d923fb36e3"

#[[kv_namespaces]]
#binding = "kv"
#id = ""

#[[r2_buckets]]
#binding = "r2"
#bucket_name = ""

#[[send_email]]
#name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 0 * * *"]

[vars]
ai_model = ""
analysis_cache = false
orm_log = false
domain = ["518811.xyz"]
admin = "1051510962@qq.com"
jwt_secret = "A8k2F9sP5dR7mT1qN4zW6cB0vE3jG8hK"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
